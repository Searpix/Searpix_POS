<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Searpix/crebulmaifrikex/refs/heads/main/logo-mroado.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Categorías - Freakers POS</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand"><img src="https://placehold.co/40x40/6C3CE1/fff?text=F" alt="Logo"><h1>Freakers POS</h1></div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-footer"><div class="license-badge" id="license-badge">🔑 Licencia: <span id="license-status-text">—</span></div></div>
    </aside>
    <div class="sidebar-backdrop" onclick="closeSidebar()"></div>
    <main class="main-content">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;">☰</button>
          <h2>📁 Administrar Categorias</h2>
          <button class="btn btn-primary" onclick="openCatModal()">➕ Nueva Categoria</button>
        </div>
        <div class="topbar-right"></div>
      </div>

      <div class="card">
        <div class="table-responsive">

          <table class="data-table" id="catTable">
          <thead><tr><th>Imagen</th><th>Nombre</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody></tbody>
        </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalCat">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="catModalTitle">➕ Nueva Categoría</h3>
        <button class="modal-close" onclick="closeModal('modalCat')">&times;</button>
      </div>
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" id="catNombre" class="form-input" required>
      </div>
      <div class="form-group">
        <label>URL Imagen</label>
        <input type="text" id="catImagen" class="form-input" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Estado</label>
        <select id="catEstado" class="form-input">
          <option value="ACTIVO">ACTIVO</option>
          <option value="INACTIVO">INACTIVO</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="guardarCat()">Guardar</button>
    </div>
  </div>

  <script src="assets/js/licencia.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    initPage('categorias', true);

    let cats = [];

    async function loadCats() {
      const data = await apiGet('categorias.php');
      cats = Array.isArray(data) ? data : [];
      renderTable();
    }

    function renderTable() {
      let html = '';
      cats.forEach(c => {
        const badge = c.estado === 'ACTIVO' ? 'badge-success' : 'badge-danger';
        const img = c.imagen || 'https://placehold.co/36x36/1F2940/fff?text=' + encodeURIComponent(c.nombre.substring(0,1));
        html += `<tr>
          <td><img src="${img}" style="width:36px;height:36px;border-radius:6px;object-fit:cover;"></td>
          <td style="font-weight:600;">${esc(c.nombre)}</td>
          <td><span class="badge ${badge}">${esc(c.estado)}</span></td>
          <td>
            <button class="btn btn-sm btn-outline" onclick="editCat('${c.idCategoria}')">✏️</button>
          </td>
        </tr>`;
      });
      document.querySelector('#catTable tbody').innerHTML = html;
    }

    function openCatModal(cat = null) {
      document.getElementById('catModalTitle').textContent = cat ? '✏️ Editar Categoría' : '➕ Nueva Categoría';
      document.getElementById('catNombre').value = cat ? cat.nombre : '';
      document.getElementById('catImagen').value = cat ? (cat.imagen || '') : '';
      document.getElementById('catEstado').value = cat ? cat.estado : 'ACTIVO';
      document.getElementById('modalCat').dataset.id = cat ? cat.idCategoria : '';
      openModal('modalCat');
    }

    function editCat(id) {
      const c = cats.find(x => x.idCategoria === id);
      if (c) openCatModal(c);
    }

    async function guardarCat() {
      const id = document.getElementById('modalCat').dataset.id;
      const nombre = document.getElementById('catNombre').value.trim();
      const imagen = document.getElementById('catImagen').value.trim();
      const estado = document.getElementById('catEstado').value;
      if (!nombre) { toast('Nombre vacío', 'error'); return; }
      const res = await apiPost('categorias.php', { id, nombre, imagen, estado });
      if (res?.exito) {
        toast('Categoría guardada');
        closeModal('modalCat');
        loadCats();
      } else { toast(res?.mensaje || 'Error', 'error'); }
    }

    loadCats();
  </script>
</body>
</html>
