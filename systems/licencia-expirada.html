<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licencia — Freakers POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0B0F19;
            --surface: #111827;
            --surface2: #1e2540;
            --primary: #6C3CE1;
            --accent: #E94560;
            --green: #4ade80;
            --text: #e0e0e0;
            --muted: rgba(255,255,255,0.45);
            --radius: 16px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-grid {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                radial-gradient(circle at 25% 35%, rgba(108,60,225,0.08) 0%, transparent 55%),
                radial-gradient(circle at 75% 65%, rgba(233,69,96,0.06) 0%, transparent 55%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }
        @keyframes bgPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Floating particles */
        .particles {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
        .particle {
            position: absolute;
            width: 3px; height: 3px;
            background: rgba(108,60,225,0.3);
            border-radius: 50%;
            animation: float var(--dur, 15s) var(--delay, 0s) ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.2; }
            50% { transform: translateY(-120px) translateX(30px); opacity: 0.6; }
        }

        /* Main card */
        .card {
            position: relative; z-index: 1;
            width: min(520px, 92vw);
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid rgba(108,60,225,0.15);
            box-shadow:
                0 0 60px rgba(108,60,225,0.08),
                0 25px 80px rgba(0,0,0,0.5);
            padding: 48px 40px 40px;
            text-align: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }

        .card-logo {
            width: 72px; height: 72px;
            border-radius: 18px;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(108,60,225,0.2), rgba(233,69,96,0.15));
            border: 1px solid rgba(108,60,225,0.2);
            font-size: 36px;
            opacity: 0;
        }

        .card-icon {
            font-size: 56px;
            margin-bottom: 8px;
            display: block;
            opacity: 0;
        }

        .card-title {
            font-size: 1.55rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            opacity: 0;
        }

        .card-subtitle {
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 32px;
            opacity: 0;
        }

        .card-subtitle .estado-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            background: rgba(233,69,96,0.12);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            margin-top: 8px;
        }

        /* Activation form */
        .form-group {
            margin-bottom: 18px;
            opacity: 0;
        }

        .form-label {
            display: block;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(108,60,225,0.2);
            background: var(--surface2);
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', monospace;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-input::placeholder {
            color: rgba(255,255,255,0.2);
            letter-spacing: 3px;
        }
        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108,60,225,0.15);
        }
        .form-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px 24px;
            border-radius: 12px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 20px rgba(108,60,225,0.3);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(108,60,225,0.45);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            box-shadow: 0 4px 20px rgba(37,211,102,0.25);
        }
        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(37,211,102,0.4);
            color: #fff;
            text-decoration: none;
        }

        .btn-outline {
            background: transparent;
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-outline:hover {
            border-color: rgba(255,255,255,0.25);
            color: var(--text);
        }

        .btn-icon {
            font-size: 1.2em;
        }

        /* License info (when active but expiring) */
        .license-info {
            margin-top: 18px;
            padding: 16px;
            border-radius: 12px;
            background: rgba(108,60,225,0.06);
            border: 1px solid rgba(108,60,225,0.1);
            text-align: left;
            display: none;
        }
        .license-info.visible { display: block; }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 0.8rem;
        }
        .info-row .label { color: var(--muted); }
        .info-row .value { font-weight: 600; color: var(--text); }

        .info-divider {
            height: 1px;
            background: rgba(255,255,255,0.05);
            margin: 8px 0;
        }

        /* Message toast */
        .toast {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 99999;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            display: none;
            opacity: 0;
            transform: translateY(-10px);
        }
        .toast.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success {
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.2);
            color: var(--green);
        }
        .toast.error {
            background: rgba(233,69,96,0.1);
            border: 1px solid rgba(233,69,96,0.2);
            color: var(--accent);
        }

        /* Footer links */
        .card-footer {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            opacity: 0;
        }

        /* Pulse animation on icon */
        .pulse {
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Shimmer for loading */
        .shimmer {
            position: relative;
        }
        .shimmer::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .card { padding: 32px 24px 28px; }
            .card-title { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-grid"></div>
    <div class="particles" id="particles"></div>

    <!-- Toast -->
    <div class="toast" id="toast"><span id="toast-icon"></span> <span id="toast-msg"></span></div>

    <!-- Main Card -->
    <div class="card" id="card">
        <span class="card-icon" id="card-icon">⚠️</span>
        <h1 class="card-title" id="card-title">Licencia Requerida</h1>
        <p class="card-subtitle" id="card-subtitle">
            No se detecto una licencia activa en este equipo.<br>
            Ingresa tu clave de activacion para continuar.
            <span class="estado-badge" id="estado-badge">SIN LICENCIA</span>
        </p>

        <!-- Activation Form -->
        <div class="form-group" id="form-group">
            <label class="form-label">Clave de Activacion</label>
            <input
                type="text"
                class="form-input"
                id="license-key"
                placeholder="XXXX-XXXX-XXXX-XXXX"
                maxlength="19"
                autocomplete="off"
                spellcheck="false"
            >
        </div>

        <button class="btn btn-primary" id="btn-activate" onclick="handleActivate()">
            <span class="btn-icon"></span> Activar Licencia
        </button>

        <!-- License Info -->
        <div class="license-info" id="license-info">
            <div class="info-row">
                <span class="label">Plan</span>
                <span class="value" id="info-plan">—</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-row">
                <span class="label">Negocio</span>
                <span class="value" id="info-business">—</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-row">
                <span class="label">Expiracion</span>
                <span class="value" id="info-expires">—</span>
            </div>
            <div class="info-divider"></div>
            <div class="info-row">
                <span class="label">Estado</span>
                <span class="value" id="info-status">—</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="card-footer" id="card-footer">
            <button class="btn btn-primary" onclick="window.location.href='dashboard'" style="width:auto;padding:12px 22px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px;margin-right:6px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Soporte por tickets
            </button>
            <button class="btn btn-outline" onclick="window.location.href='login'" style="width:auto;padding:12px 22px;">
                ← Volver al Login
            </button>
        </div>
    </div>

    <script src="assets/js/licencia.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
        /* ============================================
           License Expired Page — Client Logic
           Reads estado from URL, adapts UI, handles
           activation
           ============================================ */

        const estadoConfig = {
            SIN_LICENCIA: {
                icon: '🔑',
                title: 'Licencia Requerida',
                subtitle: 'No se detecto una licencia activa en este equipo.<br>Ingresa tu clave de activacion para continuar.',
                badge: 'SIN LICENCIA',
                showForm: true
            },
            EXPIRADA: {
                icon: '⏰',
                title: 'Licencia Expirada',
                subtitle: 'Tu licencia ha expirado. Renueva para seguir usando el sistema.',
                badge: 'EXPIRADA',
                showForm: true
            },
            REVOCADA: {
                icon: '🚫',
                title: 'Licencia Revocada',
                subtitle: 'Esta licencia ha sido revocada por el administrador.<br>Contacta al proveedor para mas informacion.',
                badge: 'REVOCADA',
                showForm: false
            },
            SUSPENDIDA: {
                icon: '⚠️',
                title: 'Licencia Suspendida',
                subtitle: 'Tu licencia esta temporalmente suspendida.<br>Contacta al proveedor para reactivarla.',
                badge: 'SUSPENDIDA',
                showForm: false
            },
            SIN_CONEXION: {
                icon: '📡',
                title: 'Sin Conexion al Servidor',
                subtitle: 'No se pudo verificar la licencia remotamente.<br>Conecta a internet para continuar (periodo de gracia: 24h).',
                badge: 'SIN CONEXION',
                showForm: true
            }
        };

        // Parse URL params
        const params = new URLSearchParams(window.location.search);
        const estado = params.get('estado') || 'SIN_LICENCIA';
        const config = estadoConfig[estado] || estadoConfig.SIN_LICENCIA;

        // Apply state-specific UI
        document.getElementById('card-icon').textContent = config.icon;
        document.getElementById('card-title').textContent = config.title;
        document.getElementById('card-subtitle').innerHTML = config.subtitle +
            '<br><span class="estado-badge">' + config.badge + '</span>';

        if (!config.showForm) {
            document.getElementById('form-group').style.display = 'none';
            document.getElementById('btn-activate').style.display = 'none';
        }

        // Auto-format license key input (add dashes)
        const keyInput = document.getElementById('license-key');
        keyInput.addEventListener('input', function(e) {
            let val = e.target.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
            let formatted = '';
            for (let i = 0; i < val.length && i < 16; i++) {
                if (i > 0 && i % 4 === 0) formatted += '-';
                formatted += val[i];
            }
            e.target.value = formatted;
        });

        // Enter key activates
        keyInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleActivate();
        });

        // Generate particles
        (function generateParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 25; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.setProperty('--dur', (10 + Math.random() * 15) + 's');
                p.style.setProperty('--delay', (Math.random() * 5) + 's');
                if (Math.random() > 0.5) {
                    p.style.background = 'rgba(233,69,96,0.2)';
                    p.style.width = '2px';
                    p.style.height = '2px';
                }
                container.appendChild(p);
            }
        })();

        // ===== Activation Handler =====
        async function handleActivate() {
            const btn = document.getElementById('btn-activate');
            const key = keyInput.value.trim();

            if (!key || key.length < 14) {
                showToast('error', 'Ingresa una clave de activacion valida.');
                gsap.fromTo(keyInput, { x: -8 }, { x: 0, duration: 0.4, ease: 'elastic.out(1,0.3)' });
                return;
            }

            // Disable UI
            btn.disabled = true;
            btn.innerHTML = '<span class="btn-icon shimmer">⏳</span> Activando...';
            keyInput.disabled = true;

            try {
                const result = await LicenciaModule.activateLicense(key);

                if (result.exito) {
                    showToast('success', result.mensaje || 'Licencia activada exitosamente!');
                    
                    // Show license info
                    if (result.licencia) {
                        showLicenseInfo(result.licencia);
                    }

                    // Success animation
                    gsap.to('#card-icon', {
                        scale: 1.3,
                        duration: 0.4,
                        ease: 'back.out(2)',
                        onComplete: () => {
                            gsap.to('#card-icon', { scale: 1, duration: 0.3 });
                        }
                    });

                    // Redirect to login after 2.5 seconds
                    setTimeout(() => {
                        gsap.to('#card', {
                            y: -40,
                            opacity: 0,
                            scale: 0.9,
                            duration: 0.5,
                            ease: 'power2.in',
                            onComplete: () => {
                                window.location.href = 'login';
                            }
                        });
                    }, 2500);

                } else {
                    showToast('error', result.mensaje || 'Error al activar la licencia.');
                    btn.disabled = false;
                    btn.innerHTML = '<span class="btn-icon">⚡</span> Activar Licencia';
                    keyInput.disabled = false;
                    keyInput.focus();

                    // Shake animation
                    gsap.fromTo('#card', { x: -10 }, { x: 0, duration: 0.5, ease: 'elastic.out(1,0.3)' });
                }
            } catch (err) {
                showToast('error', 'Error de conexion. Intenta de nuevo.');
                btn.disabled = false;
                btn.innerHTML = '<span class="btn-icon">⚡</span> Activar Licencia';
                keyInput.disabled = false;
            }
        }

        // ===== Show License Info =====
        function showLicenseInfo(lic) {
            const el = document.getElementById('license-info');
            document.getElementById('info-plan').textContent = lic.plan || '—';
            document.getElementById('info-business').textContent = lic.negocio_nombre || '—';
            document.getElementById('info-expires').textContent = lic.fecha_expiracion
                ? new Date(lic.fecha_expiracion).toLocaleDateString('es-CO')
                : 'Nunca';
            document.getElementById('info-status').textContent = lic.estado || '—';
            el.classList.add('visible');
            gsap.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4 });
        }

        // ===== Toast =====
        function showToast(type, msg) {
            const toast = document.getElementById('toast');
            const iconEl = document.getElementById('toast-icon');
            const msgEl = document.getElementById('toast-msg');
            
            toast.className = 'toast ' + type;
            iconEl.textContent = type === 'success' ? '✅' : '❌';
            msgEl.textContent = msg;
            
            gsap.fromTo(toast,
                { opacity: 0, y: -10 },
                { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }
            );

            setTimeout(() => {
                gsap.to(toast, {
                    opacity: 0,
                    y: -10,
                    duration: 0.3,
                    onComplete: () => { toast.className = 'toast'; }
                });
            }, 4000);
        }

        // ===== Load existing license info if available =====
        (async function loadExistingLicense() {
            try {
                const status = await LicenciaModule.checkLicenseStatus();
                if (status.exito && status.licencia) {
                    showLicenseInfo(status.licencia);
                }
            } catch (e) {
                // Silently ignore — page works without pre-loaded info
            }
        })();

        // ===== GSAP Entrance Animation =====
        window.addEventListener('load', () => {
            const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

            tl.to('#card', { opacity: 1, y: 0, scale: 1, duration: 0.6 })
              .to('#card-logo', { opacity: 1, y: 0, duration: 0.4 }, '-=0.2')
              .to('#card-icon', { opacity: 1, duration: 0.3 }, '-=0.1')
              .to('#card-title', { opacity: 1, duration: 0.3 }, '-=0.15')
              .to('#card-subtitle', { opacity: 1, duration: 0.3 }, '-=0.1')
              .to('.form-group', { opacity: 1, duration: 0.3, stagger: 0.08 }, '-=0.1')
              .to('#btn-activate', { opacity: 1, duration: 0.3 }, '-=0.1')
              .to('#card-footer', { opacity: 1, duration: 0.3 }, '-=0.1');

            // Pulse the lock icon
            gsap.to('#card-logo', {
                scale: 1.05,
                duration: 2,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });
        });
    </script>
</body>
</html>
