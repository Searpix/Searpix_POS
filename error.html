<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no disponible — Comandix</title>
<style>
  :root{--primary:#6C3CE1;--primary-2:#8B5CF6;--accent:#E94560;--accent-2:#F97316;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(1200px 600px at 20% -10%,rgba(108,60,225,.35),transparent),
               radial-gradient(1000px 500px at 100% 120%,rgba(233,69,96,.28),transparent),
               #070a12;color:#e8ebf5;overflow:hidden}
  .card{position:relative;max-width:560px;width:100%;text-align:center;
    background:linear-gradient(160deg,#141b2d,#0d1220);border:1px solid rgba(255,255,255,.08);
    border-radius:26px;padding:48px 38px;box-shadow:0 50px 90px -30px rgba(0,0,0,.85)}
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:#b9c0d8;
    border:1px solid rgba(255,255,255,.1);padding:7px 14px;border-radius:999px;margin-bottom:26px}
  .badge span{width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--accent))}
  .code{font-size:5.2rem;font-weight:900;line-height:1;margin-bottom:8px;
    background:linear-gradient(135deg,var(--primary-2),var(--accent));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  h1{font-size:1.5rem;font-weight:800;margin-bottom:14px}
  p{color:#a7afc7;font-size:1rem;line-height:1.6;margin-bottom:30px}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;
    padding:13px 24px;border-radius:13px;text-decoration:none;transition:.2s;border:1px solid transparent;cursor:pointer}
  .btn-primary{color:#fff;background:linear-gradient(135deg,var(--primary),var(--accent));
    box-shadow:0 14px 30px -12px rgba(108,60,225,.7)}
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-ghost{color:#cdd3e8;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.03)}
  .btn-ghost:hover{background:rgba(255,255,255,.08)}
  .icon{width:78px;height:78px;margin:0 auto 22px;display:flex;align-items:center;justify-content:center;
    border-radius:20px;background:linear-gradient(135deg,rgba(108,60,225,.22),rgba(233,69,96,.22));
    border:1px solid rgba(255,255,255,.1)}
  .icon svg{width:40px;height:40px}
  .foot{margin-top:28px;font-size:.8rem;color:#6b7391}
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span></span> Comandix · Acceso restringido</div>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <defs><linearGradient id="g" x1="0" y1="0" x2="24" y2="24">
          <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#E94560"/>
        </linearGradient></defs>
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <circle cx="12" cy="16" r="1"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1>Esta página no está disponible</h1>
    <p>La dirección que intentas abrir no existe o no forma parte de las rutas permitidas de Comandix. Verifica el enlace o vuelve al portal.</p>
    <div class="actions">
      <a class="btn btn-primary" href="views/login.html">Ir al portal</a>
      <a class="btn btn-ghost" href="portal.html#support">Contactar soporte</a>
    </div>
    <div class="foot">Comandix · Sistema de gestión de licencias</div>
  </div>
</body>
</html>
