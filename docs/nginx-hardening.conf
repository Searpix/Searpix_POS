# Comandix/Freakers - ejemplo Nginx (ajuste root y PHP-FPM)
# No exponga /config, /docs, /libs, /storage ni /tenants.
server {
    listen 443 ssl http2;
    server_name ejemplo.com;
    root /var/www/comandix;

    location ~ ^/(?:config|docs|libs|storage|tenants)(?:/|$) { return 403; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:env|log|sql|bak|ini|conf|dist)$ { return 403; }

    # Tenant clean URL -> filesystem instance.
    location ~ ^/tenant/([A-Za-z0-9_-]{1,64})(/.*)?$ {
        # En producción es preferible que este almacenamiento esté fuera del web root
        # y se sirva mediante un upstream/alias controlado.
        rewrite ^/tenant/([A-Za-z0-9_-]{1,64})(/.*)?$ /tenants/$1/systems$2 last;
    }

    location / {
        try_files $uri $uri.html $uri.php $uri/ =404;
    }

    # PHP solo cuando el archivo existe; nunca ejecute archivos de storage/config.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~ ^/api/(?:config|db_config|setup_token|_setup_guard|provisioner)\.php$ { return 403; }
    location ~ ^/systems/api/(?:config|db_config|setup_token|_setup_guard)\.php$ { return 403; }
}
